<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relax Vinnytsia</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <div id="nearMe">
        <button id="nearMeButton">
            📍 Поруч зі мною
        </button>
    </div>

    <div id="filters">

        <button data-filter="all">📍 Всі</button>

        <button data-filter="Басейн">🏊 Басейн</button>

        <button data-filter="Чан">🛁 Чан</button>

        <button data-filter="Рибалка">🎣 Рибалка</button>

        <button data-filter="Альтанка">🏡 Альтанка</button>

        <button data-filter="Будинок">🏠 Будинок</button>

        <button data-filter="Сауна/Баня">🧖 Сауна</button>

    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>

</body>
</html>
